dataset_path: Lin-Chen/MMStar
dataset_kwargs:
  token: True
task: "mmstar_ours"
test_split: val
output_type: generate_until
doc_to_visual: !function utils.mmstar_doc_to_visual
doc_to_text: !function utils.mmstar_our_doc_to_text
doc_to_target: "answer"
process_results: !function utils.mmstar_our_process_results
metric_list:
  - metric: coarse perception
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
  - metric: fine-grained perception
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
  - metric: instance reasoning
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
  - metric: logical reasoning
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
  - metric: science & technology
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
  - metric: math
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
  - metric: average
    aggregation: !function utils.mmstar_our_aggregate_results
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 16384
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: ""
