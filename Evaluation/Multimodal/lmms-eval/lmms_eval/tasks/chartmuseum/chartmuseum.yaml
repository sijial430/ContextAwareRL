dataset_path: lytang/ChartMuseum
dataset_kwargs:
  token: True
task: chartmuseum
test_split: test
output_type: generate_until
doc_to_visual: !function utils.chartmuseum_doc_to_visual
doc_to_text: !function utils.chartmuseum_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 64
  temperature: 0
  do_sample: False
process_results: !function utils.chartmuseum_process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils.chartmuseum_accuracy_aggregate
    higher_is_better: true
metadata:
  - version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nProvide your final answer in <answer>your answer</answer> tags."
