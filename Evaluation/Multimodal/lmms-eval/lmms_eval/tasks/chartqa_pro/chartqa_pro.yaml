dataset_path: ahmed-masry/ChartQAPro
dataset_kwargs:
  token: True
task: chartqa_pro
test_split: test
output_type: generate_until
process_docs: !function utils.chartqa_pro_process_docs
doc_to_visual: !function utils.chartqa_pro_doc_to_visual
doc_to_text: !function utils.chartqa_pro_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  max_new_tokens: 64
  temperature: 0
  do_sample: False
process_results: !function utils.chartqa_pro_process_results
metric_list:
  - metric: accuracy
    aggregation: !function utils.chartqa_pro_aggregate
    higher_is_better: true
metadata:
  - version: 0.0
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer the question with a single word or number."
