dataset_path: lmms-lab/ScreenSpot-Pro
dataset_kwargs:
  token: True
task: screenspot_pro
test_split: train
output_type: generate_until
doc_to_visual: !function utils.screenspot_pro_doc_to_visual
doc_to_text: !function utils.screenspot_pro_doc_to_text
doc_to_target: "instruction"
generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: False
  until:
    - "ASSISTANT:"
process_results: !function utils.screenspot_pro_process_result
metric_list:
  - metric: center_acc
    aggregation: !function utils.screenspot_pro_center_acc
    higher_is_better: true
metadata:
  - version: 0.0
