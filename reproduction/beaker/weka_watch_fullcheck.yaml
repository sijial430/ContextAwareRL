version: v2
description: Watch Weka-persisted artifacts for the active ContextAwareRL full check.
tasks:
  - name: watch-fullcheck-outputs
    image:
      docker: ubuntu:24.04
    command:
      - /bin/bash
      - -lc
      - >-
        set -euo pipefail;
        output_dir=/weka/nora-default/sijial/workspace/contextaware-rl/qwen3-8b-full-config-1-step/01M183DM2R5H8P561SRRBZT6FX;
        for iteration in $(seq 1 240); do
          trajectory_count=0;
          checkpoint_file_count=0;
          if test -d "$output_dir/traj"; then
            trajectory_count=$(find "$output_dir/traj" -type f -name '*.json' | wc -l);
          fi;
          if test -d "$output_dir/checkpoints"; then
            checkpoint_file_count=$(find "$output_dir/checkpoints" -type f | wc -l);
          fi;
          printf '%s trajectories=%s checkpoint_files=%s\n' "$(date -u +%FT%TZ)" "$trajectory_count" "$checkpoint_file_count";
          if test -s "$output_dir/SUCCESS"; then
            cat "$output_dir/SUCCESS";
            exit 0;
          fi;
          sleep 30;
        done;
        exit 1
    datasets:
      - mountPath: /weka/nora-default
        source:
          weka: nora-default
    resources:
      cpuCount: 1
      memory: 1 GiB
    constraints:
      cluster:
        - ai2/jupiter
    context:
      priority: urgent
    timeout: 3h
